name: Build Emberstorm APK

# Builds the installable APK in the cloud on every push,
# and whenever you click "Run workflow" on the Actions tab.
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Required permission to allow GitHub Actions to publish Releases
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Emberstorm-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # NEW STEP: Publishes the APK directly to the Releases page
      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          name: Emberstorm Build #${{ github.run_number }}
          tag_name: build-${{ github.run_number }}
          generate_release_notes: true
          files: app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
