name: Emberstorm
options:
  bundleIdPrefix: com.itranstudios
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
settings:
  SWIFT_VERSION: "5.9"
  MARKETING_VERSION: "1.1"
  CURRENT_PROJECT_VERSION: "2"
targets:
  Emberstorm:
    type: application
    platform: iOS
    sources:
      - Emberstorm
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.itranstudios.emberstorm
      INFOPLIST_FILE: Emberstorm/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      TARGETED_DEVICE_FAMILY: 1
      SUPPORTED_INTERFACE_ORIENTATIONS: UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
      CODE_SIGN_ENTITLEMENTS: Emberstorm/Emberstorm.entitlements
