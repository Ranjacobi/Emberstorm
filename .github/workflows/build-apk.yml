name: Build Emberstorm APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk Emberstorm.apk

      - name: Verify APK exists
        run: ls -la Emberstorm.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Emberstorm Build ${{ github.run_number }}
          tag_name: v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: Emberstorm.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
