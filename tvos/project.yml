name: Emberstorm
options:
  bundleIdPrefix: com.itranstudios
  deploymentTarget:
    tvOS: "16.0"
  xcodeVersion: "15.0"
settings:
  SWIFT_VERSION: "5.9"
  MARKETING_VERSION: "1.1"
  CURRENT_PROJECT_VERSION: "1"
targets:
  Emberstorm:
    type: application
    platform: tvOS
    sources:
      - Emberstorm
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.itranstudios.emberstorm
      INFOPLIST_FILE: Emberstorm/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
